[bar.default]
center = [ "media" ]
end = [ "tray", "notifications", "clipboard", "bluetooth", "volume", "brightness", "clock" ]
margin_edge = 0
margin_ends = 0
padding = 12
radius = 0
shadow = false
start = [ "workspaces" ]
thickness = 30
widget_spacing = 18

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    id = "g1"
    members = [ "workspaces", "wallpaper" ]
    opacity = 1.0
    padding = 6.0

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 310.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[osd]
offset_y = 50
position = "bottom_center"

[shell]
corner_radius_scale = 0.2500000037252903
font_family = "Iosevka Nerd Font"

    [shell.launcher]
    categories = false
    show_icons = false

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    directory = "/home/lauro/Immagini"

[theme]
builtin = "Catppuccin"
community_palette = "Breeze"
custom_palette = "base16"
source = "custom"
wallpaper_scheme = "vibrant"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
fill_color = "surface_variant"

[widget.clock]
format = "{:L%a %d %b, %R}"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"
